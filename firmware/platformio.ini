; molly-count — ESP32-S3-ePaper-1.54G (ESP32-S3-PICO-1-N8R8: 8MB QIO flash + 8MB OPI PSRAM)
[env:molly-count]
; 7.1.3 = the platform / arduino core 2.0.17 combo validated on the bench
; (2026-09-25). Don't bump casually: core 3.x (IDF 5.x) changes APIs.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; N8R8 module: quad flash + octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; custom table: keeps flash 0xC000-0xE000 unclaimed (persistent record, see
; partitions_molly.csv header — legacy Rust firmware wrote its record there)
board_build.partitions = partitions_molly.csv

; hardware USB-Serial-JTAG as console (matches esptool download channel;
; true deep sleep cleanly drops the USB device from the host)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"1.2\"

monitor_speed = 115200

; tool-esptoolpy >=2.41100 (2026) needs a pip post-install step that the
; Nix PlatformIO python env cannot run (no pip module) — pin the last
; self-contained release instead.
platform_packages = platformio/tool-esptoolpy@2.40900.250804
